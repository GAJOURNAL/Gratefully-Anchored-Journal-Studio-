<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gracefully Anchored Journal Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="wrap">
    <header>
      <p class="eyebrow">Gracefully Anchored</p>
      <h1>Journal Studio</h1>
      <p>Create something beautiful one simple choice at a time.</p>
    </header>
    <section class="card">
      <div class="progress"><div id="bar"></div></div>
      <div id="app"></div>
    </section>
    <section id="result" class="card hidden">
      <div class="row">
        <h2>Your Blueprint</h2>
        <button id="copyBtn">Copy</button>
      </div>
      <pre id="output"></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
